 BTK_freikors_title_text: "РотКорп"
 BTK_freikors_desc: "§YРотКорп§! - Боевые формирования возникшие в государстве §Y[THIS.GetNameDefCap]§! после начала чисток в армии. Они ярые радикалы, подавляющие коммунистические и демократические выступления на улицах при помощи оружия, которое они берут с чёрного рынка."
