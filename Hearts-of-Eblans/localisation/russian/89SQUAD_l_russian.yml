 BTK_tenMinutes_delivery_desc: "ЗАТО ДОСТАВКА ЗА 10 МИНУТ..."
 BTK_reformed_joint_army: "Центр сквадской армии"
 BTK_reformed_joint_army_desc: "Ранее страны должны были производить ротацию войск, от одной страны в другую. Из-за парализующей бюрократии и многих других факторов такое решение очень мешала стабилизации и милитаризации сквада. Но сейчас наши великие военные и аналитики разработали Сквадскую Армию Нового Поколения. Центром которой будет конечно же Вовград. Это упростит набор и обучение солдат."
