 # Events
 btk_squad.50.t: "Волнения нарезчиков"
 btk_squad.50.d: "Неразрешённые вопросы нарезок продолжают дестабилизировать ситуацию в стране. Население недовольно неопределённостью политического курса, что приводит к снижению стабильности."
 btk_squad.50.a: "Это временные трудности..."

 btk_squad.51.t: "Критика правящей партии"
 btk_squad.51.d: "Представители неинтегрированных фракций нарезчиков развернули агрессивную критику правящей партии. Их пропаганда находит отклик среди части населения, что снижает популярность правительства."
 btk_squad.51.a: "Придётся терпеть."

 btk_squad.52.t: "Чистки в рядах нарезчиков"
 btk_squad.52.d: "Противостояние фракций достигло опасной точки. Начались взаимные чистки, которые затрагивают важные сферы государства. Нам необходимо выбрать, какую сферу пострадает больше всего."
 btk_squad.52.a: "Чистки в армии"
 btk_squad.52.b: "Чистки в промышленности"

 btk_squad.53.t: "Саботаж на флоте"
 btk_squad.53.d: "Агенты противоборствующих фракций совершили акт саботажа на военно-морской базе. Несколько кораблей повреждены, а моральный дух флота подорван."
 btk_squad.53.a: "Найти виновных!"

 btk_squad.54.t: "Вопрос нарезчиков решён!"
 btk_squad.54.d: "Все фракции нарезчиков наконец-то разрешены - интегрированы или уничтожены. Политическая ситуация в стране стабилизировалась, и мы можем сосредоточиться на более важных делах."
 btk_squad.54.a: "Наконец-то порядок!"

 btk_squad.55.t: "[THIS.GetLeader] беспокоится о нарезках"
 btk_squad.55.d: "[THIS.GetLeader] начал очень сильно беспокоиться о нарезках его стримов. Он желает чтобы все приходили на стримы и не смотрели никаких нарезок, Свинопасы ёбаные! Ваша задача интегрировать или уничтожить всех нарезчиков в решениях."
 btk_squad.55.a: "Никаких нарезок!"

 BTK_Victor_brotelnikov: "Виктор Брательников"
 Vovavia_avalib_tt: "Станет доступен промышленный концерн §Y\"ВовАвиа\"§!"

 # National Spirits (Purge Debuffs)
 BTK_narezki_military_purge: "Военные чистки"
 BTK_narezki_military_purge_desc: "Противоборство фракций привело к массовым чисткам в армии. Многие опытные офицеры были уволены или арестованы, что серьёзно подорвало боеспособность вооружённых сил."

 BTK_narezki_industrial_purge: "Промышленные чистки"
 BTK_narezki_industrial_purge_desc: "Фракционная борьба затронула промышленный сектор. Многие управленцы и инженеры были смещены со своих постов, что негативно сказалось на производительности."

 BTK_narezki_naval_sabotage: "Саботаж флота"
 BTK_narezki_naval_sabotage_desc: "Диверсанты из враждебных фракций нанесли серьёзный ущерб флоту. Ремонт и восстановление морального духа займут время."

