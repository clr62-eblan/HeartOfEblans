l_russian:
 BTK_Shefius_I: "Шефиус I"
 BTK_Shefius_I_desc: "Основатель и глава всея 89 Сквад. Именно он во время всеевропейской анархии, в 2000 году нашёл архивные планы о создании 89 Сквада и реализовал их. Он провёл сквад через все проблемы - Централизацию власти в 2003, Жёсткое объединение в 2010 и Великую войну в 2012-2015 годах. Сейчас же, сквад в плачевном состоянии и держится на честном слове. Никто не знает что будет дальше."
 BTK_Squad_Parliament: "Сквадский совет"
 BTK_Squad_Parliament_desc: "Совет у сквада формально был всегда, но последний раз использовался по назначению более 10 лет назад. После консолидации власти в руках Ордената Вовграда, совет просто перестал иметь какой-либо политический вес в скваде. Но теперь Совет снова стал лидером объединения, но дельных чиновников не хвататет. сейчас Совет испытывает жёсткий кризис"
 BTK_Vladimir_Bratishkin: "Владимир Братишкин"
 BTK_Vladimir_Bratishkin_desc: "Брат и наследник Шефиуса I, пришёл к власти после смерти своего Брата. Населением 89 Сквада возложены надежды на Владимира, он по мнению народа обязан восстановить некогда великий сквад который простирался от Лиссабона до Палласа. Поднять экономику, реформировать абсолютно все сферы жизни. Будем надеяться что у него получится."
 BTK_Rish098: "Rish098"






 btk_squad.1.t: "Обход сквада"
 btk_squad.1.d: "Глава 89 Сквада, уже далеко не молодой правитель Шефиус I решил объехать главные достопримечательности Государств-членов сквада. Безусловно, ему могут помешать немногочисленные проблемы со здоровьем, но мы устроим самую стерильную и безопасную поездку для нашего лидера. 89 Сквад нынче уже не торт, но всё же, нужно показать народу что они не брошены правительством."
 btk_squad.1.a: "Только проследите чтобы всё было безопасно!"

 btk_squad.2.t: "Посещение Джоз-Вилля"
 btk_squad.2.d: "Шеф сквада посетил столицу ДжоДжоЛенда - Джоз-Вилль. Главу сквада поразила здешняя архитектура, находясь в паре сотен километров от Вовграда, кардинально отличается! Шефиус сказал: «Вот! Посмотрите! Это же великолепно! Зачем молодёжь рвётся куда-то заграницу? У нас же огромное количество интересных мест! Уверен, сейчас поедем дальше, к Муханжану, там будет ещё более самобытные архитектура и быт.»"
 btk_squad.2.a: "Потрясающе!"

 btk_squad.3.t: "Задержка поезда"
 btk_squad.3.d: "Министерство логистики экстренно остановило поезд Главы объединения. Поездка расходится с планом, Шеф уже должен быть на подъездах к Айраниту, но поезд стоит... Логисты пока молчат, но говорят мол: «Что-то не так с рельсами». Шефиус не понимает, в что с рельсами может быть не так."
 btk_squad.3.a: "Да, придётся переписать план объезда."

 btk_squad.4.t: "Подрыв поезда"
 btk_squad.4.d: "Оппозиционеры подорвали поезд в котором перемещался лидер. Шефиус мёртв. Кто это сделал, пока неизвестно но мы уверены что это представители оппозиции."
 btk_squad.4.a: "Беда для всего сквада."

 btk_squad.5.t: "Владимир Братишкин берёт ситуацию под контроль"
 btk_squad.5.d: "Брат умершего Шефа - Владимир Братишкин заявил, что роль главы Реакционистской партии по уставу переходит ему и он становится Герцогом Вовградского Ордената, но оформление его как председателя совета 89 сквада займёт время. Владимир пообещал, что ситуация в стране и скваде вцелом может исправиться только благодаря ему, он нуждается в полной народной поддержке"
 btk_squad.5.a: "Да здавствует Герцог!"

 btk_squad.6.t: "Демократы стремятся ко власти"
 btk_squad.6.d: "После смерти Шефиуса, вторая по популярности партия в Вовградском Орденате - Либеральная, в недавнем обращении к своим изберателям заявила, что будут стремится провести своих кандидатов на руководящие должности в столь непростое для страны время. Они обещают множество реформ и, конечно же, оттепель в вопросах прав и свобод."
 btk_squad.6.a: "Впрёд к светлому будущему!"

 btk_squad.7.t: "Путч подавлен"
 btk_squad.7.d: "После начала чисток и разбирательств среди нашей армии, мы вышли на нескольких персон, которые, как нам кажется, одни из управленцев террористической яйчейки в стране. После того как мы арестовали часть из них, их группировка, мобилизовав немногочисленных сторонников вышла на улицы и направилась в сторону штаб-квартиры Правительства страны, стражи порядка вступили в бой с нарушителями и быстренько подавили данное недоразумение."
 btk_squad.7.a: "Такое надо пресекать!"
 btk_squad.7.b: "Не зря чистка значит, всех на расстрел!"

 btk_squad.8.t: "Обращение Герцога"
 btk_squad.8.d: "Новопришедший Герцог Вовградского Ордената выступил со всенародным обращением к скваду и всему мировому сообществу. Обращние произошло в здании Совета Сквада. Много злобы и ярости было вылито на абсолютно всех и каждого кого Братишкин подозревал в столь бесславном распаде сквада. И Шефиус, и Дрейковия и все кто как-либо связан с любыми отрицательными событиями сквада. Учитывая риторику Владимира и его партии, от него можно ожидать чего угодно, в том числе и расправы над всеми перечисленными."
 btk_squad.8.a: "Во славу Ордената!"

 btk_squad.9.t: "Поддержка от ЧВК"
 btk_squad.9.d: "В такое сложное для страны время, главной опорой есть и остаётся армия, а точнее военная сила. Регулярная армия Ордената а уж тем более Сквада похвастаться такой силой не могут, в случае опасности они врядли смогут защитить что-то большее чем землянку в лесу. Именно поэтому мы призвали Частные военные компании поддержать нашу партию и заявить о признании легитимности Владимира Братишкина. Большинство популярных компаний именно это и сделали, это небольшой но всё таки триумф."
 btk_squad.9.a: "Народ должен быть уверен что их защитят!"

 btk_squad.10.t: "Пропаганда Либерализма"
 btk_squad.10.d: "В мире где слово либерал во многом является оскорблением, мало кто будет поддерживать а уж тем более считать себя либералом. Задача нашей партии уничтожить устоявшееся ложное мнение о либерализме, пока хотя бы в Орденате, а потом уже и во всём остальном мире. Все способы оповещения прямо сейчас вещают то, что надо для процветания свободы и демократии в нашей стране."
 btk_squad.10.a: "Либерал - не позор!"

 btk_squad.11.t: "Центробанк за нас!"
 btk_squad.11.d: "Государственный орган созданный примерно во время создания 89 сквада, до сих пор выполняет свою задачу. Конечно, с каждым годом Центробанк был всё более ненужным реакционному правительству, но доверие народа к этой структуре у реакционстов подавить не получилось. Представители Центробанка публично заявили о своей поддержке Либеральной Партии а в частности Виктора Брательникова. Их признание поможет нам на пути к власти."
 btk_squad.11.a: "Превосходно!"

 btk_squad.12.t: "Муханжан отделяется!"
 btk_squad.12.d: "Правитель Мухан-Атынской Орды Муханжан, сегодня официально подписал пакт о расторжении и денонсации договора о вступлении государства в объединение 89 сквад. Лидер страны сказал что мол Вовградский Орденат душит экономические, промышленные, политические и армейские возможности Орды и бла бла бла. На самом деле, наши политики уверены, он собирается создать коалицию против нас. Надо вернуть его в сквад как можно скорее"
 btk_squad.12.a: "Предатели!"

 btk_squad.13.t: "Выбор"
 btk_squad.13.d: "Похоже, что Владимир Братишкин после укрепления своих позиций решил окончить нашу автономию, даже без соответствующей санкции Совета 89 Сквада. Так или иначе ультиматум у нас: либо мы - это они, либо мы - это мы. Очевидно второй вариант повлечёт за собой непредвиденные последствия. Что делать?"
 btk_squad.13.a: "Мы теперь часть Ордената..."
 btk_squad.13.b: "Мы сами по себе!"

 btk_squad.14.t: "Выбор"
 btk_squad.14.d: "Похоже, что Виктор Брательников после укрепления своих позиций решил окончить нашу автономию, даже без соответствующей санкции Совета 89 Сквада. Так или иначе ультиматум у нас: либо мы - это они, либо мы - это мы. Очевидно второй вариант повлечёт за собой непредвиденные последствия. Что делать?"
 btk_squad.14.a: "Мы теперь под их юрисдикцией..."
 btk_squad.14.b: "Мы сами по себе!"

 btk_squad.15.t: "Кажется Путч начинается"
 btk_squad.15.d: "Вооружённые группы подпольной оппозиции организовали массовые восстания и идут на столицу, как оказалось, очень большая часть этих сепаратистов - члены нашей армии! Некоторые из них даже занимают довольно важные позиции! Начатая недавно чистка заставила их показать себя. Что же произойдёт?"
 btk_squad.15.a: "Путч подавлен"
 btk_squad.15.b: "Столица пала под натиском захватчиков"


 SQUAD_samodershez_pal: "Самодержец пал"
 SQUAD_samodershez_pal_desc: "Шефиус первый, поистине Самодержец Всесквадский умер от рук оппозиционеров, кто именно устроил теракт - не известно. И без того проблемный и умирающий в последнее время сквад, потрясён смертью Главы."
 SQUAD_brat_vse_ispravit: "Брат всё исправит"
 SQUAD_brat_vse_ispravit_desc: "Хоть Шефиус I и умер, из его родственников остался брат - Владимир Братишкин. Мы уверены - он сможет востановить величие сквада, ну или по крайней мере Вовградского Ордетата."
 SQUAD_mest_konfederatov: "Месть Либералов"
 SQUAD_mest_konfederatov_desc: "В скваде всегда были две наиболее сильные политические силы: правящие радикальные реакционисты и либералы, желающие установление демократического режима у всех членов сквада. Очевидно, путь свободы очень мощный и мы уверены - демократия это ключ к процветанию нашей нации."
 SQUAD_great_obrashenie: "Обращение к нации"
 SQUAD_great_obrashenie_desc: "Народ должен быть уверен что всё подконтролем, Владимир Братишкин должен записать обращение которое будет крутиться по всем телеканалам страны."
 SQUAD_private_groups_support: "Поддержка от ЧВК"
 SQUAD_private_groups_support_desc: "Наша партия - партия радикалов, искать поддержку во всяких министерствах и компаниях глупо - всё это порождение демократии и капитализма. Нам нужны те, кто разделяют наши взгляды, регулярная армия не блещет народной поддержкой, но вот ЧВК и всякие нерегулярные соединения напротив, всё популярнее и популярнее. Они - самый лучший вариант"
 SQUAD_progov_metings: "Про-правительственные митинги"
 SQUAD_progov_metings_desc: "Для всех кто сомневается в абсолютной популярности нашей партии, мы посоветуем выйти на улицу, там будут проходить множество митингов в нашу пользу, разумеется мы их и устроим, но людям об этом знать необязательно, пускай считают что это стихийные митинги."
 SQUAD_preemnik: "Преемник"
 SQUAD_preemnik_desc: "Формальным правителем пока является совет, надо бы уже узаконить права Владмира Братишкина, он будет считаться правопреемником переворачивающегося в гробу Шефиуса первого."
 SQUAD_find_imposters_in_army: "Предатели в армии"
 SQUAD_find_imposters_in_army_desc: "Наша армия побольшей части состоит из разных национальностей, эта глупая идея общей армии сквада максимально позорна. Люди перемешались, даже в некоторых генералах мы не можем на сто процентов быть уверены, вдруг они не будут лояльны центру? Надо поискать потенциальных предателей и демобилизовать их."
 SQUAD_provesti_liberalnie_idei_v_massi: "Либеральные идеи в массы"
 SQUAD_provesti_liberalnie_idei_v_massi_desc: "Надо бы включить по государственным системам оповещения различные либерально-демократические мысли, может кто-то проникнится и решит перейти на сторону свободы!"
 SQUAD_centrobank_za_nas: "Центробанк за нас!"
 SQUAD_centrobank_za_nas_desc: "Центральный банк 89 сквада, хоть в последнее время и не очень хорошо себя чувствует, всё ещё играет не последнюю роль в нашем государстве. Большинство считают именно Центробанк единственным нужным министерством в стране. Если мы заручимся его поддержкой - мы заручимся поддержкой этого большинства."
 SQUAD_poddershka_neskolkih_neytralitetov: "Поддержка монархистов"
 SQUAD_poddershka_neskolkih_neytralitetov_desc: "Хоть монархия и либерализм идеи мягко говоря разные, но монархистам считаться с либералами будет намного проще чем с радикальными реакционистами, нужно бы донести до них эту мысль, их поддержка будет не лишней на пути к нашему восхождению на президентское кресло."
 SQUAD_brotelnikov_i_partiya: "Бротельникова в президенты"
 SQUAD_brotelnikov_i_partiya_desc: "Виктор Бротельников - директор либеральной партии должен стать полноправным президентом, сейчас такого понятия нет, в нашей стране есть только совет, председатель совета, тот самый Шефиус, земля ему пухом и Герцог Ордената. Мы не будем орденатом - мы будем федерацией, поэтому и будет у нас не Герцог а Президент."
 SQUAD_reform_ministerstva: "Реформировать министерства"
 SQUAD_reform_ministerstva_desc: "Сквад за все 20 с лишнем лет своего существования раздул свою бюрократию настолько, что чтобы официально переправить десяток винтовок от Барагоззера к Гаечке, нужно ждать пару недель в лучшем случае. Это просто невыносимо, и это только один пример из множеств. Если мы хотим стремится к совершенству, нам надо упразднить или реформировать большее количество министерств."
 SQUAD_reform_centrobank: "Реформа Центробанка"
 SQUAD_reform_centrobank_desc: "Центробанк хоть и является одним из немногих более-менее нормально функционирующим министерством, но реформировать его всё же стоит."
 SQUAD_army_above_all: "Армия превыше всего"
 SQUAD_army_above_all_desc: "Указ о ротации людской силы в скваде от 2010 года положил конец нормальной регулярной армии. Да, чистка проведённая нами улучшила ситуацию но не до конца, надо бы отменить этот указ окончательно."
 SQUAD_taxes_reform: "Обрезать налоги"
 SQUAD_taxes_reform_desc: "Наши граждане - граждане великого Государства, они не должны платить налог чтобы обеспечивать общую казну сквада."
 SQUAD_remember_history: "Вспомнить историю"
 SQUAD_remember_history_desc: "Надо бы вспомнить самим, и рассказать другим, каким великим раньше был Вовградский Орденат и какие ошибки его правительство совершило. Чтобы недопустить подобных проблем в будущем."
 SQUAD_block_opponents: "Остановить оппонентов"
 SQUAD_block_opponents_desc: "Нашей партии не нужны оппоненты, именно из-за них и умер Шефиус, сквад в плачевном состоянии и народу нужно быть единым - Замечательная мысль которую мы вобъём во всех оппозиционеров."
 SQUAD_land_reform: "Земельная реформа"
 SQUAD_land_reform_desc: ""
 SQUAD_form_tankorps: "Танкоры"
 SQUAD_form_tankorps_desc: "Танкоры - отдельные танковые корпуса, специально созданные для быстрых прорывов и тактики блицкрига. Надо бы сформировать парочку таких дивизий, а то мало-ли."
 SQUAD_na_puti_k_vosstanovleniu: "На пути к величию"
 SQUAD_na_puti_k_vosstanovleniu_desc: "После самых важных реформ, можно переходить и к действиям, сквад по прежнему раздроблен, надо бы присоединить всех хотят они того или нет."
 SQUAD_slyshba_dostavki_za_ten_minut: "Служба доставки «10 минут»"
 SQUAD_slyshba_dostavki_za_ten_minut_desc: "Логистика в скваде не лучшая, именно поэтому надо открыть государственную логистическую компанию «10 минут». Чтобы всякая доставка была за 10 минут."
 SQUAD_voen_kontrakti: "Контракты с промышленниками"
 SQUAD_voen_kontrakti_desc: "Пока мы не объединены мы не можем полноценно пользоваться нормальной промышленностью всего сквада, надо бы заключить контракты с промышленниками на постройку новых фабрик и комбинатов на территории Федерации."
 SQUAD_support_otkritie_GosStroy: "Открыть ГосСтрой"
 SQUAD_support_otkritie_GosStroy_desc: "Нам нужна инфраструктура, после чисток много что разрушилось, да и то что было не сказать что прям вау. Надо открыть компанию через которую будет проще строить гражданскую инфраструктуру."
 SQUAD_stop_fascist: "Реакция не пройдёт"
 SQUAD_stop_fascist_desc: "Реакционистам не место в нашем политической системе, пока они не у власти они только и могут что дестабилизировать ситуацию, а как только получат хоть какие-то рычаги давления так сразу начнут какое-нибудь насилие будь-то физическое или психологическое."
 SQUAD_form_favr: "Сформировать ФАВР"
 SQUAD_form_favr_desc: "Демократов в мире не любят, во многих странах слово либерал неформально приравнялось к оскорблению, вдруг и в уголках сквада будет такое? или кто-то извне задумает убрать так ненавидимых ими либералов? Надо бы следить за ситуацией в мире, в лицо нам все улыбаются, но что они готовят на самом деле - загадка. Задача Федерального Агенства Внешней Разведки как раз разгадать эту загадку."
 SQUAD_osvobodim_kontinent: "На пути к воссоединению"
 SQUAD_osvobodim_kontinent_desc: "Демократия должна быть везде и всегда, большинство бывших ну и формально нынешних членов сквада в основе своей далеко не демократы. Мы обязаны это исправить."
