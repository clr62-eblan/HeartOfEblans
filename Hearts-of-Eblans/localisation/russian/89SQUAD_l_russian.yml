 SQUAD_manpower_rotation: "Указ о ротации людской силы"
 SQUAD_manpower_rotation_desc: "В 2010 году воимя объединения народов 89 сквада, был подписан указ о всеобъемлюющей ротации военных всех стран объединения. На бумаге звучало хорошо, а оказалось позором. В Армии все перемешались, другие национальности не слишком заинтереснованы защищать что-то большее чем свою родину."

