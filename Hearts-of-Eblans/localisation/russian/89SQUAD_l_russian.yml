 # Industrial Focuses
 GENERAL_gradual_approach: "Постепенный подход"
 GENERAL_gradual_approach_desc: "Рим строился не один день, и наша индустрия тоже не должна. Медленные, но уверенные шаги позволят нам избежать хаоса и коррупции."
 GENERAL_better_shovels: "Улучшение инструментария"
 GENERAL_better_shovels_desc: "Даже самый простой труд становится эффективнее, если дать рабочим качественные инструменты."
 GENERAL_cottage_industry: "Кустарная промышленность"
 GENERAL_cottage_industry_desc: "Поощрение малых мастерских и домашних производств создаст гибкую основу для будущей крупной индустрии."
 GENERAL_better_crops: "Улучшение посевов"
 GENERAL_better_crops_desc: "Сытый народ — надежная опора для государства. Мы внедрим новые культуры и методы мелиорации."
 GENERAL_leverage_religious_schools: "Использование духовных школ"
 GENERAL_leverage_religious_schools_desc: "Если у нас нет светских учителей, пусть духовные наставники научат людей грамоте и основам наук."
 GENERAL_support_local_weaponsmiths: "Поддержка местных оружейников"
 GENERAL_support_local_weaponsmiths_desc: "Армии нужно оружие, и лучше, если оно будет своего производства, даже если пока это лишь мастерские."
 GENERAL_rapid_industrialisation: "Ускоренная индустриализация"
 GENERAL_rapid_industrialisation_desc: "У нас нет времени на постепенность. Мы должны построить заводы сегодня, чего бы нам это ни стоило."
 GENERAL_FIND_EXTERNAL_HELP: "Искать поддержку из-за рубежа"
 GENERAL_FIND_EXTERNAL_HELP_desc: "Наши ресурсы ограничены, но у наших соседей есть необходимые технологии и специалисты."
 GENERAL_national_strengthening: "Национальное укрепление"
 GENERAL_national_strengthening_desc: "Индустриализация требует единства нации и жесткого контроля над ресурсами."
 GENERAL_industrial_base: "Промышленная база"
 GENERAL_industrial_base_desc: "Закладка фундаментов для будущих гигантов индустрии."
 GENERAL_import_agricultural_tools: "Импорт сельхозинструментов"
 GENERAL_import_agricultural_tools_desc: "Закупка передовой техники за рубежом позволит высвободить руки для работы на заводах."
 GENERAL_forced_revolution: "Индустриальный рывок"
 GENERAL_forced_revolution_desc: "Старый мир должен уступить место дымящим трубам и грохоту станков. Любой ценой."
 GENERAL_patriotic_literacy_campaign: "Кампания за знания"
 GENERAL_patriotic_literacy_campaign_desc: "Неграмотный рабочий — плохой рабочий. Мы обучим каждого основам, необходимым для работы на современном производстве."
 GENERAL_national_stone_road_initiative: "Национальная дорожная инициатива"
 GENERAL_national_stone_road_initiative_desc: "Вены нашей экономики должны быть прочными. Мы покроем страну сетью надежных дорог."
 GENERAL_newer_farming_methods: "Современное фермерство"
 GENERAL_newer_farming_methods_desc: "Внедрение химии и механизации в сельское хозяйство навсегда решит проблему голода."
 GENERAL_military_industry: "ВПК"
 GENERAL_military_industry_desc: "Индустрия, не способная защитить себя — бесполезна. Мы направим усилия на производство современного вооружения."
 GENERAL_dig_deep_and_greedily: "Копать глубоко и жадно"
 GENERAL_dig_deep_and_greedily_desc: "Недра нашей земли скрывают несметные богатства. Нам нужно лишь добраться до них."
 GENERAL_preserve_tradition: "Защита привычного порядка"
 GENERAL_preserve_tradition_desc: "В погоне за будущим важно не растерять то, что делало нас нами. Мы сохраним основы нашего общества."
 GENERAL_support_landowners: "Поддержка собственников"
 GENERAL_support_landowners_desc: "Верность старых элит — залог стабильности в период перемен."
 GENERAL_eternal_tradition: "Незыблемость основ"
 GENERAL_eternal_tradition_desc: "Некоторые вещи должны оставаться неизменными вечно, служа якорем в меняющемся мире."
 GENERAL_reformed_landowning: "Реформа землевладения"
 GENERAL_reformed_landowning_desc: "Земля должна принадлежать тем, кто может сделать её эффективной для государства."
 GENERAL_foreign_education: "Мировой опыт"
 GENERAL_foreign_education_desc: "Мы пошлем наших лучших людей учиться за границу, чтобы они привезли свет знаний в наши края."
 GENERAL_the_power_of_steam: "Сила производств"
 GENERAL_the_power_of_steam_desc: ""
 GENERAL_dragged_into_the_future: "Втянутые в будущее"
 GENERAL_dragged_into_the_future_desc: "Хаос индустриализации позади. Теперь мы — современная держава, готовая к любым вызовам."

 # Ideas
 GENERAL_rapid_industrialization_unrest: "Промышленное неспокойствие"
 GENERAL_rapid_industrialization_unrest_desc: "Слишком быстрые перемены пугают людей и создают почву для недовольства."
 GENERAL_industrial_sabotage: "Промышленный саботаж"
 GENERAL_industrial_sabotage_desc: "Недовольство рабочих выливается в открытое вредительство на заводах."


