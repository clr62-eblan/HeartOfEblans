 BM_HISTORY_TITLE: "Маленькая историческая справка"
 GATHERING_STORM_NAME: "Глобальные изменения"
 GATHERING_STORM_DESC: "В далёком 2015 году завершилась Великая война, начатая Дрейковой империей и её пособниками — Аратоссовым рейхом и Гондурассией — против суверенной Чикен-Беконии. За первые дни наступления Дрейка было убито более 30% всей армии Чикен-Беконии. Но пришедший на помощь чикен-беконскому народу 89-й рейх быстро расправился с угрожающим школьником: тот не смог вывести войну на два фронта. После перекройки центральной Европы мир на континенте вроде бы стабилизировался, но сейчас, в 2023 году, лодку снова начинают раскачивать. Чикен-Бекония пытается оставаться гегемоном, но при этом перевести экономику на гражданские рельсы. 89-й рейх уже далеко не сильнейшее государство в Европе — он распадается, и его правительству придётся собирать все территории вновь. Куссинская империя стремится к объединению Шпаны. Свинленд стоит на грани полнейшего распада. Гондурассия находится в стадии политического кризиса — её король собирается уходить в отставку. Союз Лайкеров пытается определить, кто они: демократы или всё-таки хайпократы-диктаторы. Дрейковия желает сбросить оковы Ебланского договора, вооружиться до зубов и устрашать любого просто своим существованием."