 BM_HISTORY_TITLE: "Маленькая историческая справка"
 GATHERING_STORM_NAME: "Глобальные изменения"
 GATHERING_STORM_DESC: "В далёком 2015 году завершилась Великая война, начатая Дрейковой империей и её пособниками — Аратоссовым рейхом и Гондурассией — против суверенной Чикен-Беконии. За первые дни наступления Дрейка было убито более 30% всей армии Чикен-Беконии. Но пришедший на помощь чикен-беконскому народу 89-й рейх быстро расправился с угрожающим школьником: тот не смог вывести войну на два фронта. После перекройки центральной Европы мир на континенте вроде бы стабилизировался, но сейчас, в 2023 году, лодку снова начинают раскачивать. Чикен-Бекония пытается оставаться гегемоном, но при этом перевести экономику на гражданские рельсы. 89-й рейх уже далеко не сильнейшее государство в Европе — он распадается, и его правительству придётся собирать все территории вновь. Куссинская империя стремится к объединению Шпаны. Свинленд стоит на грани полнейшего распада. Гондурассия находится в стадии политического кризиса — её король собирается уходить в отставку. Союз Лайкеров пытается определить, кто они: демократы или всё-таки хайпократы-диктаторы. Дрейковия желает сбросить оковы Ебланского договора, вооружиться до зубов и устрашать любого просто своим существованием."
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$\n$TRAITS_DESC|$"
 CHB_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_CHB_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nТехнический и военный гений граждан этой страны позволил ей занять обширные территории на востоке Балканского полуострова. Безопасность Чикен-Беконии была под угрозой, когда в 2013 году Дрейкова Империя и её сателлиты вероломно напали на Илью Мазелова, но благодаря храбрости чикен-беконских воинов и сотрудничеству с 89-м Рейхом поражения удалось избежать, и капитуляцию пришлось подписывать уже Дрейковой Империи. Война превратила Чикен-Беконию в угасшего монстра: раздутая военщина, бюрократия военного времени и устарелость производств тормозят развитие страны, а ещё сепаратисты с захваченных у Дрейковой Империи территорий не дают покоя. Главная задача правительства сейчас — завершить переход экономики на мирные рельсы и разобраться с сепаратистами, а кто и как это будет делать — это уже доподлинно неизвестно."
 SVI_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_SVI_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nПо-истине демократическое правительство великого объединения славных городов Свинленда защищало права и свободы своих граждан вот уже более 20 лет, но в последние годы страна погрязла в коррупции, скандалах и кризисе. Президент не может нормально ужиться с Думой, которая, в свою очередь, ничем полезным не занимается и тянет страну фактически на дно. Оппозиционеры из Бустерграда становятся всё радикальнее и активнее, жители городов начинают задумываться об отделении от этого тонущего корабля. Кто знает, может, президенту всё же удастся наладить отношения с Думой? Или, может, власть в стране возьмёт кто-то сильный? А может, бустерградовских оппозиционеров надо бы выслушать: может, у них есть дельные идеи?"
 DRE_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_DRE_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nПоявившаяся после распада Союза Коротких Видео Дрейкова Империя была сильным и вооружённым монстром. В Европе её боялись, но из-за сотрудничества Шефиуса и Мазелова и бездарности императора Дениса экспансия в Чикен-Беконию в 2013 провалилась. Дрейковия рухнула с пьедестала, на её армию наложили ограничения, а Чикен-Бекония и 89-й Рейх откусили часть территорий. Денис Коломиец, несмотря на проигранную войну и отброшенную назад страну, по странному стечению обстоятельств не потерял народной поддержки. На его плечи возложена амбициозная цель — возродить Дрейкову Империю и вернуть ей былое могущество. Будет ли он к ней двигаться? Займёт ли его пост кто-то другой?"
 GON_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_GON_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nУ страны с самого зарождения всё не слава богу: проблематичный климат и рельеф не позволяли сформировать нормальную армию, экономика всегда зависела от чего-то одного, и это приводило к проблемам. Например, 89-й Сквад: вступив в него, Гондурассия получила кучи инвестиций, всё было в шоколаде, но когда Вовградский Орденат стал подминать Сквад под себя, Гондурассии пришлось укусить руку, которая её кормила, и долго восстанавливаться. Санкции от демократов не позволяют торговать задёшево, а пристарелый монарх как будто даже не заинтересован в улучшении ситуации. Ходят слухи, он собирается уйти в отставку. Что же случится со страной? Неужели снова придёт к единственной кормушке, очередное перекрытие которой будет сильнейшим ударом? Или к власти придёт кто-то благоразумный?"
 PYA_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_PYA_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nОдно из немногих государств, которое в 2023 году находится в неплохом состоянии. Заняв не последнее место в Великой войне между Дрейковой Империей и Чикен-Беконией, Логово Босса заполучило под свой контроль Датские проливы и сформировало там марионеточное правительство Мистера Пятёрки. На первый взгляд страна непримечательна, но её жители патриотичнее граждан любых других стран, вместе взятых. Под руководством великого Кирилла Пятёрки народ стоит перед выбором: вернуться к старому устройству или продолжить экспансию хайпа."
 BTK_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_BTK_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nОбразованный в 2000-х, «Сквад» был объединением независимых государств, простиравшимся почти по всей Европе. В 2003–2006 годах Вовградский Орденат начал централизовать власть, армию и промышленность в руках Шефиуса. Многие страны — Гондурассия, Чикен-Бекония, Дрейковия, Свинленд и другие — вышли из состава Сквада. В 2010 году Шефиус жёстко объединил оставшихся членов в 89-й Рейх. Силовики подавляли любое несогласие, в этот период откололось ещё несколько отдалённых стран. После победы в Великой войне подъём сменился стагнацией и рецессией. Шефиус начал терять влияние и подписал указ о де-юре независимости членов Сквада. Это пошатнуло и без того хрупкий Рейх, хотя Вовград сохранил некоторое влияние. Сейчас Сквад на пороге распада. Шефиус отправляется в тур по странам-участницам. Что будет с объединением — неизвестно."
 ARA_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_ARA_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nРанее великое морское государство по своей глупости вступило в войну против Чикен-Беконии на стороне Дрейка. Дрейк был уничтожен, и силы 89-го Рейха и Чикен-Беконии направились против главного пособника войны — Аратосса. Ла-Манш прорвали, а с ним в скором времени пал и Капибардон. Стране пришлось подписать мирный договор, флот теперь порезан, а северная часть острова по какой-то причине контролируется майонезной жопой."
 OTHERS_HISTORY_TEXT: "\n\n\n\n\n\n\n\n£GFX_texticon_NOPIC_history\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nМир меняется, все стремятся к мировому господству: кто-то — через торговлю, демократию и свободу, кто-то — через созидательный нейтралитет, а кто-то — силой оружия."