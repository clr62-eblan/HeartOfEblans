 bus_com.5.t: "Подчинение городов"
 bus_com.5.d: "После прихода коммунистической власти в стране, далеко не все города её признали. Надо дать понять всем недалёким, кто теперь правит Свинлендом"
 bus_com.5.a: "Объяните им"

