 svin.80.t: "Тропиканское прошлое"
 svin.80.d: "Антон фон Скырлович — выходец из карибских государств, а в частности из Тропико. Он был там единоличным диктатором, но затем его же силовики похитили его и подменили на двойника, а двойник подписал закон о проведении выборов. Фон Скырлович смог бежать из плена, но возвращаться в Тропико было уже поздно — его бы там приговорили к тюрьме, поэтому он бежал в Прибалтику, где и застал формирование объединения независимых городов, впоследствии прозванного Свинлендом."
 svin.80.a: "Его опыт из Тропико пойдёт нам на пользу"
