 svin.90.t: "[PYA.GetNameDefCap]: друг или враг?"
 svin.90.d: "На западе от нас расположился очень влиятельный и очень большой сосед — Пятёрка. Надо принять тот факт, что рано или поздно наши интересы столкнутся, и, по-хорошему, надо выстраивать отношения уже сейчас."
 svin.90.a: "[PYA.GetAdjective]ое государство — наш друг"
 svin.90.b: "[PYA.GetAdjective]ому государству нельзя доверять!"
 svin.91.t: "[FROM.GetNameDefCap] обращается к нам"
 svin.91.d: "С нами связались наши восточные соседи. Они хотят развивать более серьезные дипломатические отношения. Их предложение может быть выгодным для обеих сторон, но нам следует убедиться, что мы делаем правильный выбор."
 svin.91.a: "Ну конечно!"
 svin.91.b: "Нет, для нас в этом нет никакой выгоды."
 svin.92.t: "[FROM.GetAdjective]ое государство соглашается"
 svin.92.d: "Руководство [FROM.GetNameRuGen] согласно, что обе наши страны только выиграют от укрепления дипломатических отношений. Теперь в этом мире, который с каждым днем становится все враждебнее, у нас появится новый друг и союзник."
 svin.92.a: "Отлично!"
 svin.93.t: "[FROM.GetAdjective]ое государство не соглашается"
 svin.93.d: "Несмотря на выгоду для обеих сторон, [FROM.GetAdjective]ое государство, похоже, не стремится укреплять с нами дипломатические отношения. Мы возлагали большие надежды на этот союз, но они не оправдались."
 svin.93.a: "Жаль..."

 bus_com.1.t: "Пионерская Организация"
 bus_com.1.d: "Различные молодёжные организации были под запретом во время правления капиталистов и демократов. Сейчас же это просто необходимо. Мы должны правильно формировать мировоззрение подростков, чтобы защитить их от опасного внешнего мира и чтобы в будущем они могли защищать от него свою Родину. Мы начинаем ускоренное строительство пионерских лагерей."
 bus_com.1.a: "Так и нужно"
 bus_com.2.t: "Патриотеское воспитание"
 bus_com.2.d: "Пионерия — это хорошо, но на одной теории далеко не уедешь. Что будут делать наши дети, когда на нас вновь нападут империалистические капиталисты? То-то и оно! Поэтому некоторые лагеря будут переоборудованы в военно-патриотические училища."
 bus_com.2.a: "Правильное решение"
 bus_com.3.t: "С Первым Сентября!"
 bus_com.3.d: "Этот день теперь будет нашим национальным днём знаний. Да, раньше он тоже считался таковым, но это не было ничем подкреплено, и мало кто относился к этому с серьёзом. Центральный комитет согласовал соответствующий указ."
 bus_com.3.a: "Всё верно!"
 bus_com.4.t: "Новое имя родины революции"
 bus_com.4.d: "Гражданская война завершена, и нашему генералу Ковбою КекВ пришла в голову мысль, которую поддержало большинство населения. Так как влияние коммунистической партии с одного только Бустерграда распространилось на всю страну, нужно назвать наше государство немного иначе. Соответствующие указы уже подписаны."
 bus_com.4.a: "Да здравствует СССГ!"

 bus_emp.1.t: "Надо бы укрепить режим"
 bus_emp.1.d: "После успешно завершённой Гражданской войны Имперский режим потерял довольно большую часть своих сторонников, так как часть из них оказалась предателями-коммунистами. Поддержка режима некоторыми городами также упала. Нам необходимо укрепить власть Императрицы, чтобы подобных бунтов больше никогда не случалось."
 bus_emp.1.a: "Так точно"
 bus_emp.2.t: "В экономике развал"
 bus_emp.2.d: "Экономический кризис, возникший благодаря усилиям демократов, со сменой власти, к сожалению, не исчез. Проблемы надо решать, и наши экономисты составили план плавной стабилизации ситуации. Конечно, придётся отказаться от своего торгового прошлого — экономика переориентируется на внутренний рынок, но аналитики уверяют: это пойдёт только на пользу нашей Великой Империи."
 bus_emp.2.a: "Мы востановим нашу экономику!"

 bus_emp.3.t: "Вопрос вкладов"
 bus_emp.3.d: "В наших банках лежит довольно много денег различных государств. Да, большинство из бывших вкладчиков уже давно вывели свои активы, но некоторые остались. Там лежит довольно кругленькая сумма. Мы можем заморозить все эти счета и, конечно же, взять в долг из этих средств. Это пойдёт нашей Великой и прекрасной Родине только на пользу."
 bus_emp.3.a: "Заморозить счета"
 bus_emp.3.b: "Не будем рисковать репутацией"

 bus_emp.4.t: "Разгон думы"
 bus_emp.4.d: "После прихода к власти Императрицы смысла в существовании Народной думы нет абсолютно никакого. Своими законопроектами и придумками они только убивают нашу Империю. Зажравшиеся чиновники из Думы должны быть разогнаны. Отряды силовиков готовы к штурму, ждём только вашей команды."
 bus_emp.4.a: "Вперёд!"

 bus_emp.5.t: "Запрет демократической партии"
 bus_emp.5.d: "Наверное, уже абсолютно все поняли, что демократическая партия и демократия в целом — это зло. Этот «свободный» режим тянул нас на дно вот уже больше 20 лет, но теперь мы на самом деле свободны. Эти либералы знаете что предлагают? Свободу слова, мысли и действий! Хах, вы только представьте: идёте вы по улице, а вас начинают крыть трёхэтажным матом двухметровые амбалы. Вам бы было приятно? А вот она, свобода слова. А они ещё и презентуют это как благо! Вздор."
 bus_emp.5.a: "Давно пора их запретить"

