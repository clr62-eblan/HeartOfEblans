 svin.70.t: "Роспуск Свинтогона"
 svin.70.d.coms: "Свинтогон - структура произведённая капиталистами и империалистами, она была создана и работала только чтобы буржуи жировали. Мы разогнали эту структуру а всех причастных растреляли!"
 svin.70.d.imper: "Свинтогон - структура произведённая либералами и коммунистами, она всегда работала на уничтожение Имперского величия Бустерграда и всего Свинленда. Существования данной конторы не представляется возможным - структура была расформирована указом Императрицы."
 svin.70.a: "Всё правильно."

 svin.72.t: "Посещение Банана-Бич"
 svin.72.d: "Президент страны Антон T2x2 отправился на пароме в город Банана-Бич в ходе своего турне по городам Свинленда. Тамошняя атмосфера поразила президента. «Уютные острова и песчаные берега — это очень замечательно», — сказал он. Также правительство города отдало во владение президенту один из своих многочисленных островов. Антон согласовал постройку новой дачи на этом месте."
 svin.72.a: "Славный город Банана-Бич!"
 svin.73.t: "Посещение Киссон-Сити"
 svin.73.d: "Президент страны Антон T2x2 отправился в город Киссон-Сити в ходе своего турне по городам Свинленда. Президента поразила красота Киссоновских садов, но больше всего на Антона впечатление произвела величественная Галерея Артов. Антон T2x2 согласовал покупку двух артов в свою личную коллекцию."
 svin.73.a: "Славный город Киссон-Сити!"
 svin.74.t: "Посещение Бустерграда"
 svin.74.d: "Президент страны Антон T2x2 отправился в город Бустерград на бронепоезде в ходе своего турне по городам Свинленда. В связи с накалёнными отношениями между столицей и Бустерградом президента всю его дорогу сопровождал отряд полиции. Господин президент посетил театр — полупустое каменное строение, но, чтобы не провоцировать принимающий город, президент отреагировал сдержанно. Также на президента чуть не упал бустерградовский дирижабль, но, благо, он успел увернуться. Президенту пришлась по нраву недавно отстроенная церквушка. Также Антона T2x2 повели на экскурсию в гулаг и попытались затолкать его в одну из клеток, но он успел ретироваться, использовав эндер-перл."
 svin.74.a: "Славный? город Бустерград!"
 svin.75.t: "Посещение PIECEдец"
 svin.75.d: "Президент страны Антон T2x2 отправился в город PIECEдец в ходе своего турне по городам Свинленда вопреки плану на дрезине по железной дороге, по причине того что его бронепоезд разобрали неравнодушные бустерградовцы. Президенту всё пришлось по вкусу, особенно он отметил красоту парящих в воздухе гор. Также Антону провели экскурсию по новым районам, один из которых выполнен в японском стиле. Президент остался доволен и уже возвращается в столицу."
 svin.75.a:0 "#Это PIECEдец блять"
 svin.71.t: "Турне по городам"
 svin.71.d: "Антон T2x2 выразил желание совершить обход крупнейших городов страны, дабы показать жителям что президент всё ещё заинтересован простым людом. Народная Дума это решение поддержала, был составлен план посещения: На пароме на острова Банана-Бич, на воздушном шаре перелететь в Киссон-сити, на бронепоезде доехать до Бустерграда и дальше "
 svin.71.a: "Отправляемся!"
 svin.76.t: "Проблема в Хайперлупе"
 svin.76.d: "Возвращаясь в столицу по хайперлупу, президент страны попал в несколько ДТП и несколько пробок, а виной тому игроки, которые ездят абсолютно как им хочется, вопреки общепринятым правилам. Антона T2x2 это взбесило, и он собирается обратиться в Народную думу, чтобы та ратифицировала план правил ПДД, составленный несколько месяцев назад."
 svin.76.a: "Дума ратифицирует правила ПДД"
 svin.76.b: "Дума закроет на это глаза"
