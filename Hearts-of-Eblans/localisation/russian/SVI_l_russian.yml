 svin.43.t: "Продажа Суэцкого канала"
 svin.43.d: "К нам обратилось консульство Свинленда, она передали предложение от своего правительства - они хотят купить Суэцкий канал. Свинленд уже несколько лет сохраняет честное и демократическое правление, они говорят что будут использовать его для расширения торговых возможностей, помимо этого они хотят оставить нам проход через эти территории. Как мы поступим?"
 svin.43.a: "Почему бы и нет, мы продадим"
 svin.43.b: "Нет, этот канал нам ещё нужен"
 svin.44.t: "Бустер согласился!"
 svin.44.d: "Правительство Бустеренко согласились продать нам Суэцкий канал! Да здравствует свобода, торговля и демократия!"
 svin.44.a: "Правильный выбор"
 svin.45.t: "Нам отказали"
 svin.45.d: "Правительство полковника Бубстеренко нам отказало, они не продадут нам Суэцкий канал. Они сказали, что он им ещё нужен и наши торговые усилия их не очень волнуют."
 svin.45.a: "Тогда заберёт его потом и силой"
 svin.46.t: "Массовые протесты"
 svin.46.d: "В столице Империи Бустерграде начались массовые погромы, мятежниками был взорван мост. Они хотят \"избавиться от гнёта капитализма\", Они хотят свергнуть Императора! Необходимы решительные действия!"
 svin.46.a: "Разберитесь с коммунистами!"

 svin.47.t: "Военное положение"
 svin.47.d: "В стране введено военное положение всвязи с учащением погромов и набегов революционеров, мы призвали наших граждан не выходить на улицу и крепко запирать двери, протестанты не должны думать что их поддерживают наши граждане"
 svin.47.a: "Так точно!"

 svin.48.t: "Танки на улицах"
 svin.48.d: "Мы вывели на улицы городов танки, надеемся это заставит революционеров одуматься. Пока они убежали в Киссон-Сити искать поддержку у тамошних жителей, но если они вернуться мы встретим их силой"
 svin.48.a: "Поделом"

 svin.49.t: "Протест подавлен"
 svin.49.d: "Наша разведка доложила: \"сегодня днём был ликвидирован последний очаг сопротивления, протестующие пытаются прятатся но мы их ищем\". Хотя до нас доходят и слухи о том что сопротивление не подавлено а всё ещё существует, Империя выстояла, как всегда. Слава Империи"
 svin.49.a: "Слава Империи!"

 svin.50.t: "Странные персоны"
 svin.50.d: "По городам Бустерграда расхаживают довольно подозрительные люди, мы опасаемся что они могут иметь неблагородные цели, возможно, остатки протестующих, возможно кто-то ещё"
 svin.50.a: "Проследите за ними"

 svin.51.t: "ДРГ из Киссона"
 svin.51.d: "Наши опасения были не напрасны, эти люди - представители Диверсионно-Разведыватевательной группы прямиком из Киссон-Сити. Они напали на нашу территорию. Мэр Бустерграда БигПиг подтвердил - они пришли с территории Киссона."
 svin.51.a: "Мы обязаны защищаться"

 svin.52.t: "Мобилизация"
 svin.52.d: "Императорша Бустерградовской Империи подписала манифест о мобилизации в Бустерграде. БигПиг прокомментировал это следующим образом: \"МОБИЛИЗАЦИЯ СУКА\"."
 svin.52.a: "Выбить этих наглецов!"

 svin.53.t: "Мы победили"
 svin.53.d: "Очистка от террористов завершена, Империя может спать спокойно. Киссон-Сити пал под власть Императора, теперь никто не сможет помешать нашей экспансии"
 svin.53.a: "Империя выстоит любые невзгоды"

 svin.54.t: "Интересная находка" #FOR IMPERIAL
 svin.54.d: "Репортёры различных СМИ начали замечать - по городу развесили плакаты с неподобающими лозунгами \"Нахуй императора\", за этим точно стоят коммунисты, мы должны быть начеку и не допустить раскола в обществе."
 svin.54.a: "Как же уже достали эти коммунисты"
 svin.54.b: "Да здравствует революция!"
 svin.55.t: "Нас обнаружили" #FOR COMMUNISTS
 svin.55.d: "Репортёры различных СМИ начали замечать плакаты с нашими лозунгами, хоть мы и просили однопартийцев не делать ничего публичного - они сделали, так что мы теперь под наблюдением имперских сил. Надо быть осторожнее"
 svin.55.a: "Ничего ничего, скоро мы их свергнем!"
 svin.56.t: "Революция!" #FOR iMPERIAL
 svin.56.d: "Шум и гам в Бустерграде - началась коммунистическая революция, её глава - Ковбой КекВ. Они пошли на нас, на наших граждан, на наш честный и праведный режим с оружием, мы ответим им тем же."
 svin.56.a: "Впрёд Империя!"
 svin.57.t: "Революция!" #FOR COMMS
 svin.57.d: "Шум и гам в Бустерграде - началась коммунистическая революция, Мы её начали, мы! Наш глава - Ковбой КекВ идёт вперёд и весь пролетариат за ним! Мы свергнем капиталистических угнетателей и вернём былой Бустерград!"
 svin.57.a: "Вива ля Революсьён"
 svin.58.t: "Побег Императорши" #FOR COMMS
 svin.58.d: "Император Бустерградовской Империи Apachana в тайне покинула столицу - город под властью коммунистов! Лидер революции заявил: \"Все те, кто пособничал Имперскому режиму, рьяно поддерживал их деятельность будут растреляны! Те же, кто помогал организации революции и занимали какие-либо важные должености - займут почётные места в новом социалистичском правительстве.\". Это можно считать нашей победой, гнилое и продажное имперское правительство бежало, этим оно доказало своё нежелание защищать своих же граждан которыми они так часто прикрывались, стыд и позор всем пособникам империи!"
 svin.58.a: "Конец капитализму и империализму!"
 svin.59.t: "Покушение на лидера Революции" #FOR Imperials
 svin.59.d: "Нашими бравыми партизанами был совершён набег на место дислокации верхушки коммунистической партии, Ковбой КекВ мёртв! Мы уничтожили последний оплот красной чумы, они падут перед нами!"
 svin.59.a: "Мы Имперцы, с нами Бог!"
 svin.60.t: "Внештатные выборы президента" #FOR Imperials
 svin.60.d: "В связи с участившимися протестами, а также с обращения ряда глав городов Думой Свинленда было принято решение о проведении внештатных выборов президента Свинленда. Президент утратил доверие как жителей, так и самой Думы, он разрушает и грабит нашу страну. В ближайшие дни в Сёгунате будут проведены выборы."
 svin.60.a: "Да будет так!"
 svin.61.t: "Выборы завершены - ЦИК Свинленда" #FOR Imperials
 svin.61.d: "Согласно подсчёту бюллетеней на прошедших выборах победил БигПиг набрав 54 голоса, также в выборах участвовали следующие кандидаты: Зараза - 29 голосов, ГолденВинд и Неокософ - 19 голосов, Пупес - 12 голосов и 4 бюллетени были испорчены."
 svin.61.a: "Да здравствует БигПиг"
 svin.62.t: "Император берёт верх" #FOR Imperials
 svin.62.d: "Недавно избранный президент БигПиг решил отдать часть своей власти Императору Бустерградовской Империи, сам он останется на высших позициях государства и будет оставаться мэром города Бустерград."
 svin.62.a: "Да здравствует Император"
 svin.63.t: "Император мёртв!" #FOR Imperials
 svin.63.d: "Император Бустерградовской Империи SCAWENGER (Андрей I) совершил самоубийство. Неизвестно, что его сподвигло на такое, но в любом случае правительство империи выбирало нового Императора - Валерия I Великая. Это первый раз в истории когда главой Бустерградовской Империи становится женщина."
 svin.63.a: "Будем надеяться на её благоразумность"
 svin.64.t: "Императорша сбежала" #FOR Imperials
 svin.64.d: "Императорша Бустерградовской Империи Apachana в тайне покинула столицу. В безопасносности ли она и что с ней происходит неизвестно. Она бросила всё и никому ничего не сообщила. Что будет с Империей предполагать сложно, возможно, Империя продолжит всё существование в качестве оккупированной территории."
 svin.64.a: "Империя не падёт никогда!"

 svin.65.t: "Киссон почти пал"
 svin.65.d: "Наша армия продвигается всё глубже в города Киссон-Сити, отряды их диверсионистов не могут противостоять нашей профессиональной армии"
 svin.65.a: "Мы их уничтожим"


 svin.67.t: "Основание Эленмара"
 svin.67.d: "На новозахваченных территориях возник новый город - Эленмар. \"Мы община эльфов, когда-то уже потерявших свой дом, но сумевших, не смотря на наши различия, объединиться! Наши края простираются вокруг вокруг Великого Древа - источник светлых сил, возникший из неоткуда на просторах Свинленда. Быть может, оно скрывает в себе нечто большее? Кто знает…\""
 svin.67.a: "Это круто"
 svin.69.t: "Основание Браавоса"
 svin.69.d: "На новозахваченных территориях возник новый город — Браавос. Состоящий из выходцев из ныне не существующего Ардента, снежный снаружи, но очень тёплый и уютный внутри, город славится не столько своими архитектурными проектами, сколько своими добродушными жителями. Поистине легендарные игроки живут в этом городе."
 svin.69.a: "Это круто"

 squad_news.37.t: "Выборы на Свинленде"
 squad_news.37.d: "Пару дней назад на Свинленде прошли внештатные выборы президента, согласно заявлениям ЦИК Свинленда - это оказался БигПиг. Он уже вступил в должность и начал устанавливать свои правила. Граждане надеяться что он исправит текущую ситуацию в стране"
 squad_news.37.a: "Поздравляем"

