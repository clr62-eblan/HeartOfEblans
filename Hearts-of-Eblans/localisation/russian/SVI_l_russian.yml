 bus_com.6.t: "Требование из [SVI.GetNameDefCap]"
 bus_com.6.d: "Правительство государства [SVI.GetNameDefCap] настойчиво требует, чтобы мы прислушались к пролетариату нашей страны и передали власть в их руки. В ином случае, говорят они, они сами сделают это."
 bus_com.6.a: "Прислушаемся"
 bus_com.6.b: "Никакого пролетариата"

 bus_com.7.t: "Ответ от [FROM.GetNameDefCap]"
 bus_com.7.d: "На наше официальное требование передчи власти рабочим и крестьянам, государство [FROM.GetNameDefCap] ответило отказом"
 bus_com.7.a: "Нападём на них и освободим"
 bus_com.7.b: "Будем поддерживать их коммунистов"

 bus_com.8.t: "Бустерград требует Сардинию"
 bus_com.8.d: "Новоиспечённое коммунистическое правительство Свинленда, он же Бустерград, он же СССГ, требует передачи под их протекцию острова Сардиния. По их словам: «Пролетариат этого острова всегда высказывался и высказывается в пользу объединения с Бустерградом! В случае отказа это будет расцениваться как отказ народу и объявление ему войны!»"
 bus_com.8.a: "Пущай забирают"
 bus_com.8.b: "Сардиния останется нашей!"

 bus_com.9.t: "Отказ от Бустера"
 bus_com.9.d: "Правительство Бустеренко отказало нам в передаче острова. Они были предупреждены, что подобный ответ будет расценён как война против своего народа. Как же мы поступим?"
 bus_com.9.a: "Мы поддержим рвение пролетариата Сардинии"
 bus_com.9.b: "Забудем как страшный сон"

 bus_com.10.t: "Бустэрэнко соглашается"
 bus_com.10.d: "Чиновники протектората Бустеренко сделали правильный выбор и передали нам остров Сардиния, теперь здешний протекторат под полноценной защитой и никогда не будет притесняться!"
 bus_com.10.a: "Отличная работа!"

