 chicken.40.t: "Учреждение Субъекта Беконии [ROOT.GetNonIdeologyName]"
 chicken.40.d: "Наша метрополия, [FROM.GetNameDef], сообщает, что наше действующее соглашение подлежит пересмотру. В целях объединения рабочих всего нашего блока нам будет предписано дать метрополии доступ к большей части нашей промышленности, которая будет использована на благо нашего народа. Нашего мнения никто не спрашивает, и жалоб наших никто слушать тоже не будет. Когда мы принимали их помощь, мы знали, что всё может закончиться именно этим."
 chicken.40.a: "Это всё в интересах нашего народа."

 chicken.41.t: "Интеграция [ROOT.GetNameRuGen]"
 chicken.41.d: "Наша история в качестве Субъекта Беконии подходит к концу. [FROM.GetAdjective]ое руководство весьма довольно нашими стараниями и теперь считает нас чем-то большим, чем просто зависимой территорией. Нам пожалована великая честь стать полноправной частью [FROM.GetAdjective]ого государства. Конечно же, это значит, что о независимости мы можем забыть, но нас уверяют, что с нашими гражданами будут обращаться справедливо."
 chicken.41.a: "Так себе честь, но кто нас спрашивает?"

 squad_news.35.t: "В Чикен-Беконии открыт парк PHANTASMAGORIA"
 squad_news.35.d: "Для повышения среднего показателя радости населения, в столице Чикен-Беконии Мазок-Граде был отстроен парк атракционов PHANTASMAGORIA"
 squad_news.35.a: "Надо бы на автодром"

