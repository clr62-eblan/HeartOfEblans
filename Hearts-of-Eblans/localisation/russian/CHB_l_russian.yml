 chicken.45.t: "Выступления на Севере"
 chicken.45.d: "Вновь неспокойные сепаратисты с северных территорий проявляют активность. Их лидер — Лин Найт — вместе с отрядом своих подчинённых устроил массовые погромы: они атаковали полицейские машины, бросали коктейли Молотова и дымовые шашки, избивали прохожих. Кого смогли — задержали, но сепаратистское движение в этом регионе не состоит из пары задержанных человек: их тысячи, если не больше. Надо побороть этих сепаратистов раз и навсегда."
 chicken.45.a: "Найдите всех и накажите"
 
 CHB_maza: "Илья Мазелофф"
 CHB_mzlff_desc: "Славный малый, взявший власть в стране в далёком 2002 году, до сих пор остаётся одним из немногих, в ком народ видит того, кто приведёт страну в светлое будущее. Благодаря его выдержке и рассудительности страна сначала умудрилась выйти из 89-го сквада, не повредив отношения с Шефом, а потом выдержала Великую войну, организованную Дрейковой Империей. С каждым подобным событием популярность Мазелоффа росла неимоверными темпами, в то время как популярность его политических оппонентов (таких как Завернтин), наоборот, падала. Сейчас близится очередное потрясение на Европейском континенте, и бремя его преодоления, скорее всего, снова ляжет на Илью."

 CHB_zavertin: "Кот Завертин"
 CHB_zavertin_desc: "Политический деятель начал свою политическую деятельность после завершения Великой войны. Ранее он был главнокомандующим армии Чикен-Беконии, но при нападении Дрейковой Империи подал в отставку. Коммунистическая партия изначально была довольно публичной, но после укрепления диктатуры ушла в подполье. Но недавно, молниеносными темпами нарастив электорат, коммунистическая партия начала марш на столицу Чикен-Беконии, закончившийся свержением власти Мазелоффа. Мало кто был согласен с такими переменами, но их мнение в новом правительстве почти никого не интересовало."

