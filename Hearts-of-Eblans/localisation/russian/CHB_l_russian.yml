 chicken.43.t: "Снова проблемы с Севером"
 chicken.43.d: "Как оказалось, Дрейковия последние несколько лет, ростила у нас под носом террористическую яйчейку, прямо на наших Северных территориях, сейчас же, когда Дрейковия набралась сил и могущества - эти яйчейки захватили пункты управления в северных регионах и провозгласили отделение Севера как отдельного и независимого государства, по их словам такое желание выражает и выражал всегда народ этих самых Северных территорий. Наши войска были нагло выдавлены с этих территорий."
 chicken.43.a: "Что-то мне это напоминает... Готовте пушки!"

