 chb_sever.3.t: "Ввод регулярной армии"
 chb_sever.3.d: "Наш генштаб полноценно ввел в города северной части страны регулярные батальоны, возникли множественные стычки. Множество сепаратистов были повержены, оставшиеся уходят в подполье. Не зря мы выбрали позицию силы"
 chb_sever.3.a: "Да здравствует мудрый вождь!"
 chb_sever.5.t: "Ввод регулярной армии, но..."
 chb_sever.5.d: "Наш генштаб полноценно ввел в города северной части страны регулярные батальоны, возникли множественные стычки. Множество сепаратистов были повержены, но нас начали теснить. Дивизии армии вынуждены были ретироваться - в ином случае могли пострадать мирные граждане, Сепаратисты объявили \"освободительный\" марш..."
 chb_sever.5.a: "Поднять резервы!"
 chb_sever.4.t: "Войска не введены..."
 chb_sever.4.d: "Генштаб облажался, план по вводу регулярной армии и массового ареста всех инакомыслящих - провалился. Необходимые дивизии не были подвидены а планы уже успели просочиться в публику. Северные сепаратисты не стали это терпеть - они объявили \"освободительный\" марш..."
 chb_sever.6.t: "Охота на отступников"
 chb_sever.6.d: "Бравые боевые группы инквизиции провели массовые рейды на известные места дислокации командных пунктов Северного сепаратистского движения. Нашим людям пришлось вступить в схватку с этими вооружёнными боевиками. Пришлось положить не одну жизнь, но мы надеемся что эта жертва не была напрасной"
 chb_sever.6.a: "..."
 chb_sever.7.t: "Подъём сепаратизма"
 chb_sever.7.d: "Северные сепаратисты, которые уже несколько лет не дают нам и нашим гражданам спокойно жить - снова поднимаются с колен. Популярность их главаря Лёни ЛинНайта растёт бешеными темпами, нам нужно порешать вопрос северных территорий раз и навсегда"
 chb_sever.7.a: "Окэй"
 
