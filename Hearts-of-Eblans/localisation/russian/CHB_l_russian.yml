 # --- Political Branch Events ---
 chb_politics.1.t: "Положительная диктатура"
 chb_politics.1.d: "Мазелофф укрепил свою власть, установив режим «положительной диктатуры». Жёсткий, но эффективный порядок вещей: каждый чиновник знает своё место, каждый военный — свой пост. Страх? Возможно. Но народ сыт, армия вооружена, а границы — на замке. Кто-то скажет что это тирания, но мы предпочитаем слово «стабильность»."
 chb_politics.1.a: "Долгих лет Мазелоффу!"

 chb_politics.2.t: "Переговоры с ЛинНайтом"
 chb_politics.2.d: "Наши дипломаты провели секретные переговоры с координатором северных сепаратистов — ЛинНайтом. Ему была предложена солидная сумма за прекращение подрывной деятельности на севере. Ответ ЛинНайта не заставил себя ждать:\n\n«Этих денег не хватит на всех трансформеров и артбуки что я хочу.»\n\nПереговоры провалились. Деньги потрачены впустую. Но по крайней мере мы узнали его слабости..."
 chb_politics.2.a: "Чёртовы коллекционеры..."

 chb_politics.3.t: "Модеры возвращаются на фронт"
 chb_politics.3.d: "Аппостол и Мирамест привели в исполнение приказ о возврате модераторов на действительную военную службу. Эти люди — ветераны информационных войн и уличных столкновений. На передовой от них будет куда больше толку, чем в чатах. Опыт модерации пригодится и в штабной работе — они привыкли быстро принимать решения под давлением."
 chb_politics.3.a: "Банхаммер — и на фронте банхаммер."

 chb_politics.4.t: "Нация едина!"
 chb_politics.4.d: "Сегодня историческый день. Все фракции страны — от военной верхушки до промышленников и даже бывших оппозиционеров — объединились под знаменем Чикен-Беконии. Угрозы извне сплотили народ. Мазелофф выступил с пламенной речью перед войсками в столице, завершив словами: «Мы — один народ, одна нация, одна сила!»\n\nМобилизационный потенциал страны заметно вырос."
 chb_politics.4.a: "За Чикен-Беконию!"

 chb_politics.5.t: "Судьба Флек-Ленда"
 chb_politics.5.d: "Флек-Ленд — демократическое государство на территориях северо-западной Турции. Стратегически важный регион, контролирующий Стамбул и проливы. Наше командование разработало два варианта действий."
 chb_politics.5.a: "Предложить Стамбул в обмен на гарантии"
 chb_politics.5.b: "Забрать силой — готовить вторжение!"

 chicken.44.t: "Облавы на сепаратистов"
 chicken.44.d: "Наши специалисты выхватили пару десятков сепаратистов известных нашим разведчикам, проведя допрос мы много чего узнали об устройстве сепаратистского движения. Какой-то строгой иерархии, сильной армии и другого у них нет, но зато мы вышли на след Дрейковых спец. служб, возможно в подобных сепаратистских настроениях северного народа замешана Дрейковия, а возможно и сам [DRE.GetLeader]"
 chicken.44.a: "Теперь мы знаем о них всё!"
 

 chb_politics.50.t: "Ультиматум Чикен-Беконии"
 chb_politics.50.d: "Чикен-Бекония требует передачи Стамбула в обмен на гарантии нашей независимости. Отказ может привести к войне."
 chb_politics.50.a: "Принять условия — отдать Стамбул"
 chb_politics.50.b: "Отказать! Мы не поддадимся шантажу!"

 chb_politics.51.t: "Флек-Ленд согласился"
 chb_politics.51.d: "Руководство Флек-Ленда приняло наши условия. Стамбул переходит под наш контроль. Взамен мы обеспечиваем гарантии их суверенитета."

 chb_politics.52.t: "Флек-Ленд отказал"
 chb_politics.52.d: "Флек-Ленд отверг наш ультиматум. Что ж, дипломатия не всегда работает. Теперь у нас есть все основания для военных действий."
 chb_politics.52.a: "Что ж, будет по-нашему."

 chb_politics.6.t: "Красная угроза"
 chb_politics.6.d: "Контрразведка раскрыла подпольную коммунистическую сеть, связанную с бывшим товарищем Завертиным. Ячейки проникли в профсоюзы, заводы и даже некоторые воинские части. Агитаторы распространяют листовки с призывами к «народной революции». Если не принять мер — это может перерасти в полноценный заговор."
 chb_politics.6.a: "Раздавить красную гадину!"

 chb_politics.7.t: "Арест Завертина"
 chb_politics.7.d: "Кот Завертин — бывший революционный лидер и вдохновитель коммунистического подполья — был задержан силовиками в конспиративной квартире. При аресте были изъяты документы о связях с иностранными агентами и планы по дестабилизации режима. Завертин будет предан суду."
 chb_politics.7.a: "Никаких революций на нашей земле."

 chb_politics.8.t: "Министерство правды"
 chb_politics.8.d: "По личному указу Мазелоффа создано Министерство правды — орган тотального информационного контроля. Все СМИ, включая стримерские и блогерские площадки, теперь обязаны получать лицензию. Нелицензированный контент — вне закона. «Народу нужна правда, — заявил Мазелофф. — А правда будет наша.»"
 chb_politics.8.a: "Правда одна — и она наша."

 chb_politics.9.t: "Ломауполис"
 chb_politics.9.d: "Город Ломауполис — стратегически важный населённый пункт, контролируемый Ломакией. Мы направили ультиматум с требованием его передачи."
 chb_politics.9.a: "Отправить ультиматум"

 chb_politics.10.t: "Интеграция Ломакии"
 chb_politics.10.d: "Пришло время окончательно решить вопрос Ломакии. Это слабое государство более не имеет права на отдельное существование — его территории должны стать частью Чикен-Беконии."
 chb_politics.10.a: "Потребовать полную интеграцию"

 chb_politics.11.t: "Восточные претензии"
 chb_politics.11.d: "Территории к востоку от наших границ — Гвинляндия — исторически принадлежали нашим предкам. Генштаб подготовил документы, обосновывающие наши территориальные претензии. Пропаганда уже работает — население Гвинляндии должно узнать, что их «свобода» — это иллюзия."
 chb_politics.11.a: "Восток будет нашим!"

 chb_politics.12.t: "Требование Кипра"
 chb_politics.12.d: "Остров Кипр - стратегически важная точка в Средиземноморье. Его контроль обеспечит нам доминирование в регионе и прикроет южные морские пути."
 chb_politics.12.a: "Потребовать дипломатически"
 chb_politics.12.b: "Взять силой"

 chb_politics.13.t: "Я — Чикен-Беконец!"
 chb_politics.13.d: "Чикен-Бекония достигла апогея своего могущества. Все завоёванные территории интегрированы, все враги повержены или покорены. Мазелофф обращается к нации: «Каждый клочок этой земли — наш. Каждый человек на ней — чикен-беконец. Не по крови, а по духу. Мы строили эту страну — и мы будем её защищать.»"
 chb_politics.13.a: "Я — ЧИКЕН-БЕКОНЕЦ!"


 chicken.38.t: "Концерт в Калининграде"
 chicken.38.d: "Недавно прошедший в Калининграде концерт Phantasmagoria тура произвёл довольно смешанное впечатление на присутствующих. Всё дело в том, что Илья Мазелов явился на мероприятие в не очень трезвом состоянии. Согласно нашей аналитике, большинство людей, яро осуждающих эту выходку, — дети. Но дети хоть и большинство, но не все, так что неплохо было бы извиниться."
 chicken.38.a: "Принести извинения"

 squad_news.34.t: "Мазелова забанили в тиктоке за его большой огрурец"
 squad_news.34.d: "У главы Чикен-Беконии Мазелова прямо в кабинете располагается домашний сад, и, продемонстрировав выросшие там огурцы со словами: «Огурец гигантский, просто огромный», он был забанен в ТикТоке на пару дней. Печально, не так ли?"
 squad_news.34.a: "Пихуй"

 chicken.39.t: "Наверное школьники из ТикТока были правы"
 chicken.39.d: "Да, наверное всё таки дети правы - Егермейстер зло, больше значит пить не будем"
 chicken.39.a: "Не будем"

