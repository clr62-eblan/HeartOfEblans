 chicken.42.t: "Мятеж Северян?"
 chicken.42.d: "Наши войска были выставлены и переведены в режим боевого дежурства прямо по границе северных территорий, но… ничего не произошло. Вопреки заявлениям их координатора ЛинНайта, многотысячные толпы не вышли против нашего \"режима\". Как позже выяснилось, ЛинНайт бежал из страны в африканские государства. С новым координатором сепаратистского движения был заключён мирный договор — все разногласия между нашими народами решены раз и навсегда."
 chicken.42.a: "Ну и замечательно"

