 # CHB Industrial Focus Tree Descriptions
 chb_structural_assessment_of_production_desc: "Нам необходимо провести полный аудит наших производственных мощностей. Это позволит выявить слабые места и подготовить почву для планомерной и безопасной модернизации без лишнего риска для экономики."
 chb_simplification_of_bureaucracy_desc: "Бюрократический аппарат разросся до невероятных масштабов, мешая развитию промышленности. Мы упростим процедуры отчетности и устраним коррупционные лазейки, чтобы ускорить рост."
 chb_industry_renisance_desc: "Пора отбросить устаревшие методы и совершить гигантский скачок в будущее! Мы мобилизуем все ресурсы для немедленного обновления заводов, используя передовые технологии. Это будет нелегко, но плоды этой победы будут сладки."
 chb_smartiks_industry_desc: "Группа Смартики предлагает нам инновационные решения в области производства. Поддержка этой группы даст нам доступ к передовым военным разработкам и уникальным производственным методам."
 chb_nationalisation_of_military_contracts_desc: "Чтобы обеспечить максимальную эффективность в критический период, государство должно взять под свой прямой контроль все военные заказы. Это позволит избежать спекуляций и гарантировать снабжение армии."
 chb_preparedness_for_protracted_war_desc: "Мир становится нестабильным, и наша промышленность должна быть готова к любому развитию событий. Мы завершаем процесс модернизации, создавая устойчивую и мощную экономическую базу, способную выдержать испытание временем."

 # Tooltips
 CHB_structural_path_tt: "§YНачинает путь стабильной модернизации.§!\nБезопасный путь с бонусами к стабильности и постепенным ростом."
 CHB_renaissance_path_tt: "§YНачинает путь ускоренной модернизации.§!\nРискованный путь с мощными бонусами, но возможностью §Rэкономического кризиса§! в будущем."
 CHB_intervention_success_tt: "§GНаше вмешательство позволило временно стабилизировать ситуацию.§!"
 
 
 