 KUS_control_of_grazdanskiy_oborot: "Контроль гражданского оборота"

 kussia.1.t: "Медленная но уверенная стабилизация"
 kussia.1.d: "Хоть распад Шпаны и был гиперсильным ударом по и без того не очень стабильной ситуации страны, но народ смог принять произошедшее, наш путь хоть и попытались сбить, но мы его скоординировали. Страна продолжит своё существование и ничего больше не сможет нам помешать. Теперь мы будем готовы к любым ситуациям!"
 kussia.1.a: "Мы выстоим!"

 kussia.3.t: "Конец мирного времени"
 kussia.3.d: "Правительство и народ пришли к единому и единственному верному решению - необходимо усовершенствовать нашу военную мощь, в ином случае мы просто не сможем противостоять каким бы то ни было угрозам из-за границы."
 kussia.3.a: "Всем делать снаряды!"

 kussia.10.t: "Всадник геноцида"
 kussia.10.d: "Фашистский режим в стране всё укрепляется, интерес к маргинальной ютуб-истории растёт. Пора применять меры, лучше добровольно уступить место в правительстве нежели провоцировать кровопролитие."
 kussia.10.a: "Мы встанем с колен"

