l_russian:
 kussia.15.t: "Инспекции в Мин. Обороны"
 kussia.15.d: "Всвязи с довольно разряжённой обстановкой в нашей армии в последнее время, нашим главой было принято решение перевернуть абсолютно всё министерство обороны вверх дном, авось предателей найдём, посмотрим что выйдет из этой авантюры."
 kussia.15.a: "Пиздос"
 kussia.16.t: "Успех!"
 kussia.16.d: "Старания нашего великого государства оправдались в полной мере, в различных военных частях нашей страны были вычисленны и жестоко наказаны те, кто собирался обернуться против нашей страны как только грянет буря. Нам не нужны такие солдаты в нашей бравой армии, они не смогут защитить наших граждан при внезапном нападении врага! Эти представители рода людского были повешены одним приказом."
 kussia.16.a: "Потрясающий результат"

 kussia.17.t: "Артёмчик Граф"
 kussia.17.d: "Артём Граф хоть и пропал с интернет-радаров, но не пропал с политических карт. Он давно мазолит глаза не только нам, но и всем странам мира и скандинавам особенно. Наша цель интегрировать его как можно раньше, пока это не сделал кто-то другой."
 kussia.17.a: "Организуйте операцию"

 kussia.18.t: "Операция \"Грамофон\""
 kussia.18.d: "Операция \"Грамофон\" проведённая нашими Силами Специальных Операций прошла успешнее некуда, Артём Граф был захвачен и вывезен из страны! Его остров теперь полностью под нашим контролем. Вместе с ним были сумки денег, скорее всего полученные от букмекеров и различных казино. Теперь это всё наше."
 kussia.18.a: "Наградить ответственных!"

 kussia.19.t: "Операция \"Грамофон\""
 kussia.19.d: "Операция \"Грамофон\" проведённая нашими Силами Специальных Операций потерпела полнейшее фиаско. Кто же знал что одного Артём Графа охраняет целый десяток установок ПВО и около 20 тяжёлых танков! Так ещё и десяток дивизий! Мы не были к этому готовы, к сожалению, Артём Граф остаётся там где был, молниеносного захвата не вышло..."
 kussia.19.a: "Уволить ответственных!"

 kussia.12.t: "Инициатива Каши"
 kussia.12.d: "Наш старый добрый друг и союзник Каша предложил одну занимательную идею - объединить наши нации. Власть будет в его руках но наше правительство также будет занимать руководящие должности. Ну? Как поступим?"
 kussia.12.a: "Почему бы и нет, мы доверяем Вове"
 kussia.12.b: "Нет, у нас свой путь"
 kussia.20.t: "Мафаня отказался"
 kussia.20.d: "Эммм, мы думали что они согласятся, но к сожалению мы ошибались, они не приняли нашу идею об объединении..."
 kussia.20.a: "Мафаня выбрал себе незавидную судьбу"

 kussia.2.t: "Список наследников"
 kussia.2.d: "Наши аналитики, историки и политики составили список тех кто претендует на Шпанийскую корону, а также список требований к ним. Наше правительство объявило - восстановление Шпаны не за горами"
 kussia.2.a: "Вперёд Шпана"
 kussia.4.t: "Составлена Имперская Хартия"
 kussia.4.d: "Мы наконец составили Имперскую Хартию - главный закон нашего Хайпократического государства, мы всё ближе и ближе к всемирному величию"
 kussia.4.a: "Превосходно"

