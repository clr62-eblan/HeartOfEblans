l_russian:
 kussia.15.t: "Инспекции в Мин. Обороны"
 kussia.15.d: "Всвязи с довольно разряжённой обстановкой в нашей армии в последнее время, нашим главой было принято решение перевернуть абсолютно всё министерство обороны вверх дном, авось предателей найдём, посмотрим что выйдет из этой авантюры."
 kussia.15.a: "Пиздос"
 kussia.16.t: "Успех!"
 kussia.16.d: "Старания нашего великого государства оправдались в полной мере, в различных военных частях нашей страны были вычисленны и жестоко наказаны те, кто собирался обернуться против нашей страны как только грянет буря. Нам не нужны такие солдаты в нашей бравой армии, они не смогут защитить наших граждан при внезапном нападении врага! Эти представители рода людского были повешены одним приказом."
 kussia.16.a: "Потрясающий результат"

 kussia.1.t: "Медленная но уверенная стабилизация"
 kussia.1.d: "Хоть распад Шпаны и был гиперсильным ударом по и без того не очень стабильной ситуации страны, но народ смог принять произошедшее, наш путь хоть и попытались сбить, но мы его скоординировали. Страна продолжит своё существование и ничего больше не сможет нам помешать. Теперь мы будем готовы к любым ситуациям!"
 kussia.1.a: "Мы выстоим!"

 kussia.3.t: "Конец мирного времени"
 kussia.3.d: "Правительство и народ пришли к единому и единственному верному решению - необходимо усовершенствовать нашу военную мощь, в ином случае мы просто не сможем противостоять каким бы то ни было угрозам из-за границы."
 kussia.3.a: "Всем делать снаряды!"

